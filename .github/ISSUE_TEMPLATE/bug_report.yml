name: "🐛 Bug Report"
description: "Report a bug in MythicPlusTracker"
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!  
        Please fill out the fields as completely as possible.

  - type: input
    id: app_version
    attributes:
      label: App Version
      description: Which MythicPlusTracker version are you using?
      placeholder: e.g. v1.2.3
    validations:
      required: true

  - type: input
    id: wow_version
    attributes:
      label: World of Warcraft Version
      placeholder: Use the ingame command '/script print(select(4, GetBuildInfo()))'.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug as clearly as possible.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Please include logs, stack traces, or screenshots if possible.
      render: shell
    validations:
      required: false
