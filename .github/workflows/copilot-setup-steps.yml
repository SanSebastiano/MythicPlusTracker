name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # Must be named exactly "copilot-setup-steps" to be picked up by the cloud agent.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Lua and luacheck
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y lua5.1 luarocks
                  sudo luarocks install luacheck

            - name: Verify luacheck works
              run: luacheck --version

            - name: Make tool scripts executable
              run: chmod +x tools/*.sh
