name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release from CHANGELOG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: Extract version and notes from CHANGELOG.md
        id: changelog
        run: |
          # Get the first ## [x.y.z] line
          LINE=$(grep -m1 "^## \[" CHANGELOG.md)
          if [ -z "$LINE" ]; then
            echo "ERROR: No version entry found in CHANGELOG.md"
            exit 1
          fi

          # Extract version from brackets, e.g. [1.0.0] -> 1.0.0
          VERSION=$(echo "$LINE" | grep -oP '(?<=\[)[^\]]+')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Detect pre-release
          if echo "$VERSION" | grep -qiE '\-(pre|alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Extract release notes: lines after the first ## [ until the next ## [
          NOTES=$(awk 'found && /^## \[/{exit} /^## \[/ && !found{found=1; next} found{print}' CHANGELOG.md | sed '/./,$!d')
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag_check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            --repo "${{ github.repository }}"
