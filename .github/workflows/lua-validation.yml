name: PR Validation

on:
  pull_request:
    branches: [ develop ]

jobs:
  validate:
    name: Locale, TOC & Lua validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone --depth=1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Locale validator
        run: bash Tools/locale-validator.sh

      - name: TOC validator
        run: bash Tools/toc-validator.sh

      - name: Luacheck
        run: luacheck .
